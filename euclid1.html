<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Öklid I.1 Simülasyonu</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#fafaf7;color:#222;text-align:center}
h1{font-size:1.2rem;margin:14px 8px 4px}
svg{width:min(96vw,760px);height:auto;background:#fff;border:1px solid #ddd;border-radius:8px}
.draw{fill:none;stroke-width:2.5;transition:stroke-dashoffset 1.4s ease}
.draw.on{stroke-dashoffset:0 !important}
.circA{stroke:#c0504d}.circB{stroke:#4f81bd}.base{stroke:#333}
.el{opacity:0;transition:opacity .6s}.el.on{opacity:1}
.draw:not(.on){opacity:1}
.hlR{stroke:#d33;stroke-width:6;stroke-linecap:round}
.hlB{stroke:#27c;stroke-width:6;stroke-linecap:round}
.hlG{stroke:#2a8f3c;stroke-width:6;stroke-linecap:round}
.fill{fill:#2a8f3c;fill-opacity:.15}
.pt{fill:#222}.lbl{font-size:22px;font-style:italic;font-family:Georgia,serif}
#cap{min-height:3.6em;max-width:720px;margin:10px auto;padding:0 12px;font-size:1.05rem}
button{font-size:1rem;margin:4px;padding:8px 16px;border:1px solid #888;border-radius:6px;background:#fff;cursor:pointer}
button:hover{background:#eee}
</style></head><body>
<h1>Öklid, Elemanlar, Kitap I, Önerme 1 — Eşkenar üçgen inşası</h1>
<svg viewBox="0 0 800 640" id="svg">
<rect class='el' data-s='8' style='display:none'/>
<polygon class='el fill' data-s='8' points='300.00,340.00 500.00,340.00 400.00,166.79'/>
<circle class='draw circA' data-s='1' cx='300.00' cy='340.00' r='200.00' style='stroke-dasharray:1256.64;stroke-dashoffset:1256.64' transform='rotate(180 300.00 340.00)'/>
<circle class='draw circB' data-s='2' cx='500.00' cy='340.00' r='200.00' style='stroke-dasharray:1256.64;stroke-dashoffset:1256.64' transform='rotate(180 500.00 340.00)'/>
<line class='draw base' data-s='0' x1='300.00' y1='340.00' x2='500.00' y2='340.00' style='stroke-dasharray:200.00;stroke-dashoffset:200.00'/>
<line class='draw base' data-s='4' x1='300.00' y1='340.00' x2='400.00' y2='166.79' style='stroke-dasharray:200.00;stroke-dashoffset:200.00'/>
<line class='draw base' data-s='5' x1='500.00' y1='340.00' x2='400.00' y2='166.79' style='stroke-dasharray:200.00;stroke-dashoffset:200.00'/>
<line class='el hlR' data-s='6' data-e='7' x1='300.00' y1='340.00' x2='500.00' y2='340.00'/>
<line class='el hlR' data-s='6' data-e='7' x1='300.00' y1='340.00' x2='400.00' y2='166.79'/>
<line class='el hlB' data-s='7' data-e='8' x1='500.00' y1='340.00' x2='300.00' y2='340.00'/>
<line class='el hlB' data-s='7' data-e='8' x1='500.00' y1='340.00' x2='400.00' y2='166.79'/>
<line class='el hlG' data-s='8' x1='300.00' y1='340.00' x2='500.00' y2='340.00'/>
<line class='el hlG' data-s='8' x1='300.00' y1='340.00' x2='400.00' y2='166.79'/>
<line class='el hlG' data-s='8' x1='500.00' y1='340.00' x2='400.00' y2='166.79'/>
<g class='el' data-s='0'><circle class='pt' cx='300.00' cy='340.00' r='5'/><text class='lbl' x='274.00' y='348.00'>A</text></g>
<g class='el' data-s='0'><circle class='pt' cx='500.00' cy='340.00' r='5'/><text class='lbl' x='514.00' y='348.00'>B</text></g>
<g class='el' data-s='3'><circle class='pt' cx='400.00' cy='166.79' r='5'/><text class='lbl' x='394.00' y='152.79'>C</text></g>
</svg>
<div id="cap"></div>
<div>
<button onclick="go(-1)">◀ Geri</button>
<button onclick="go(1)">İleri ▶</button>
<button onclick="auto()">▶ Otomatik oynat</button>
<button onclick="show(0)">⟲ Baştan</button>
</div>
<div id="cnt"></div>
<script>
const steps=["Başlangıç: Verilen AB doğru parçası. Bunun üzerine bir eşkenar üçgen çizeceğiz.","Adım 1: Merkezi A, yarıçapı AB olan çemberi çiz. (Postülat 3)","Adım 2: Merkezi B, yarıçapı BA olan çemberi çiz. (Postülat 3)","Adım 3: İki çemberin kesiştiği noktaya C de.","Adım 4: A noktasını C noktasına birleştir: AC. (Postülat 1)","Adım 5: B noktasını C noktasına birleştir: BC. (Postülat 1)","Kanıt 1: A merkezli çemberde A, C ve B çember üzerinde; dolayısıyla AC = AB (yarıçaplar).","Kanıt 2: B merkezli çemberde BC = BA (yarıçaplar).","Sonuç: Aynı şeye eşit olanlar birbirine eşittir (Ortak Kavram 1) → AB = AC = BC. ABC eşkenar üçgendir. Ne yapılması istendiyse o yapıldı (Q.E.D.)."];
let n=0,timer=null;
function show(k){
  n=Math.max(0,Math.min(steps.length-1,k));
  document.querySelectorAll('[data-s]').forEach(e=>{
    const s=+e.dataset.s, en=e.dataset.e===undefined?Infinity:+e.dataset.e;
    e.classList.toggle('on', s<=n && n<en);
  });
  document.getElementById('cap').textContent=steps[n];
  document.getElementById('cnt').textContent='Adım '+n+' / '+(steps.length-1);
}
function go(d){stop();show(n+d)}
function stop(){if(timer){clearInterval(timer);timer=null}}
function auto(){stop();show(0);timer=setInterval(()=>{if(n>=steps.length-1)stop();else show(n+1)},2300)}
show(0);
</script></body></html>
